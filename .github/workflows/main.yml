name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - uses: actions/upload-artifact@v7
        with:
          name: input-buffer-android64
          path: ${{ steps.build.outputs.build-output }}
